<div class="register-container">

  <h2>Create Account</h2>

  <form (submit)="register()">

    <div>
      <label>Name</label>
      <input
        type="text"
        name="name"
        [(ngModel)]="name"
        required
      />
    </div>

    <div>
      <label>Email</label>
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        required
      />
    </div>

    <div>
      <label>Password</label>
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        required
      />
    </div>

    <button type="submit">
      Register
    </button>

  </form>

</div>

<p>
  Already have an account?
  <a routerLink="/login">Login</a>
</p>
